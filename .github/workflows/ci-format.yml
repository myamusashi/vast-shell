name: format

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  format:
    name: format check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v14

    - name: Set up Nix cache
      uses: DeterminateSystems/magic-nix-cache-action@v8

    - name: Enter the flake devShell
      uses: nicknovitski/nix-develop@v1

    - name: Check formatting
      run: |
        # clang-format and qmlformat come from the devShell, so there is no
        # second package list here to keep in step with shell.nix.
        clang-format --version
        qmlformat --version
        Assets/shell/check-format.sh
