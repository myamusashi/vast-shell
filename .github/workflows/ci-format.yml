name: format

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  format:
    name: format check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-nix
      with:
        devshell: "true"
    - name: Check formatting
      run: bash Assets/shell/check-format.sh
