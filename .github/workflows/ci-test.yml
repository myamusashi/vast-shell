name: test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  cpp-test:
    name: ctest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: cpp-test-${{ github.ref }}
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-nix
      with:
        devshell: "true"
    - uses: ./.github/actions/test-cpp

  go-test:
    name: go test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: go-test-${{ github.ref }}
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-nix
      with:
        devshell: "true"
    - uses: ./.github/actions/test-go
