name: lint

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  clazy:
    name: clazy + clang-tidy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: clazy-${{ github.ref }}
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-nix
      with:
        devshell: "true"
    - uses: ./.github/actions/lint-clazy

  qmllint:
    name: qmllint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ./.github/actions/setup-nix
      with:
        devshell: "true"
    - uses: ./.github/actions/lint-qmllint
